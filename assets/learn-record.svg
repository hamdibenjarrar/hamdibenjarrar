<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" role="img" aria-labelledby="title desc">
  <title id="title">Verified learning record</title>
  <desc id="desc">Microsoft Learn snapshot: 188 badges and 42 trophies. Anthropic Academy: 16 certificates, six Developer, four Agent, and six Fluency. The linked profile opens the current Microsoft Learn collection.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238636" stop-opacity=".16"/>
      <stop offset=".58" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <style>
    .pulse{animation:pulse 3s ease-in-out infinite}
    .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}
    .reveal{animation:reveal .8s cubic-bezier(.16,1,.3,1) both}
    .sweep{animation:sweep 9s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sweep{0%,30%{transform:translateX(-420px)}75%,100%{transform:translateX(1620px)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1198" height="378" rx="24" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
    <rect x="2" y="2" width="1196" height="376" rx="23" fill="url(#wash)"/>

    <text x="48" y="55" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2">LEARNING RECORD / VERIFIED ACHIEVEMENTS</text>
    <circle class="pulse" cx="1138" cy="50" r="5" fill="#3fb950"/>
    <text x="1122" y="55" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="end" letter-spacing="1.2">PUBLIC RECORD</text>

    <g class="reveal">
      <rect x="48" y="78" width="352" height="218" rx="18" fill="#161b22" stroke="#30363d"/>
      <circle cx="100" cy="157" r="30" fill="#238636" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".72"/>
      <circle class="orbit" cx="100" cy="157" r="38" fill="none" stroke="#3fb950" stroke-opacity=".45" stroke-dasharray="2 8"/>
      <path d="M100 136l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="148" y="154" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700">188</text>
      <text x="150" y="187" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6">EARNED BADGES</text>
      <text x="150" y="216" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Microsoft Learn</text>
      <text x="72" y="270" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Skills learned and put into practice</text>
    </g>

    <g class="reveal" style="animation-delay:.12s">
      <rect x="424" y="78" width="352" height="218" rx="18" fill="#161b22" stroke="#30363d"/>
      <circle cx="476" cy="157" r="30" fill="#2f81f7" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".72"/>
      <circle class="orbit" cx="476" cy="157" r="38" fill="none" stroke="#58a6ff" stroke-opacity=".42" stroke-dasharray="2 8" style="animation-direction:reverse"/>
      <path d="M465 138h22v8c0 11-5 17-11 20-6-3-11-9-11-20zm-1 5h-8v4c0 8 5 12 13 13m26-17h8v4c0 8-5 12-13 13m-13 6v11m-10 0h20" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="524" y="154" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700">42</text>
      <text x="526" y="187" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6">TROPHIES</text>
      <text x="526" y="216" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Microsoft Learn</text>
      <text x="448" y="270" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Milestones earned across learning paths</text>
    </g>

    <g class="reveal" style="animation-delay:.24s">
      <rect x="800" y="78" width="352" height="218" rx="18" fill="#161b22" stroke="#30363d"/>
      <circle cx="852" cy="157" r="30" fill="#a371f7" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".72"/>
      <circle class="pulse" cx="852" cy="157" r="38" fill="none" stroke="#bc8cff" stroke-opacity=".38" stroke-dasharray="3 7"/>
      <path d="M840 143h12c5 0 8 3 8 8v22c0-5-3-8-8-8h-12zm24 0h-4v30c0-5 3-8 8-8h8v-22h-12" fill="none" stroke="#bc8cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="900" y="154" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700">16</text>
      <text x="902" y="187" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6">CERTIFICATES</text>
      <text x="902" y="216" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Anthropic Academy</text>
      <rect x="824" y="244" width="82" height="28" rx="14" fill="#2f81f7" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".42"/>
      <text x="865" y="262" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".6">6 DEVELOPER</text>
      <rect x="915" y="244" width="77" height="28" rx="14" fill="#a371f7" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".42"/>
      <text x="953.5" y="262" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".6">4 AGENT</text>
      <rect x="1001" y="244" width="126" height="28" rx="14" fill="#238636" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".42"/>
      <text x="1064" y="262" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".6">6 FLUENCY</text>
    </g>

    <line x1="48" y1="320" x2="1152" y2="320" stroke="#30363d"/>
    <text x="52" y="352" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing=".8">MICROSOFT LEARN SNAPSHOT: 24 NOV 2026</text>
    <text x="1148" y="352" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="end">Open the live profile for every badge and latest totals  -&gt;</text>
    <rect class="sweep" x="0" y="0" width="320" height="380" fill="url(#sheen)"/>
  </g>
</svg>
