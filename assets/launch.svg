<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" role="img" aria-label="Profile operating system of Hamdi Ben Jarrar, designer and developer. Quick access to About, Projects, Agents, Path, and Support.">
<defs>
<clipPath id="frame"><rect width="1200" height="560" rx="28"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.o{animation:drift 16s ease-in-out infinite alternate}.o2{animation-duration:21s;animation-direction:alternate-reverse}.o3{animation-duration:26s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,36px)}}
.sheen{animation:sheen 7s cubic-bezier(.16,1,.3,1) infinite}
@keyframes sheen{0%,35%{transform:translateX(-40%) skewX(-18deg)}80%,100%{transform:translateX(140%) skewX(-18deg)}}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.island{animation:island 5s cubic-bezier(.16,1,.3,1) infinite}@keyframes island{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.05)}}
.float{animation:float 6s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-8px)}}
.float2{animation:float 7.5s ease-in-out -2s infinite alternate}@keyframes float2{to{transform:translateY(7px)}}
.spring{transform-box:fill-box;transform-origin:center;animation:spring .9s cubic-bezier(.16,1,.3,1) both}@keyframes spring{0%{opacity:0;transform:scale(.82) translateY(18px)}70%{transform:scale(1.04) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.orbit{transform-origin:1030px 258px;animation:orbit 22s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}
.ticker{opacity:0;animation:ticker 13.8s linear infinite}@keyframes ticker{0%,2%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:none}33.3%,100%{opacity:0;transform:translateY(-8px)}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="560" fill="#07070a"/>
