<text x="84" y="438" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" font-weight="400" fill="#c9a84c" fill-opacity="1" text-anchor="start" letter-spacing="2">WHAT I DO</text>
<g class="ticker"><text x="84" y="462" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">Coordination and communication</text></g><g class="ticker" style="animation-delay:4.6s"><text x="84" y="462" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">Product design and code</text></g><g class="ticker" style="animation-delay:9.2s"><text x="84" y="462" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">AI systems, Arabic first</text></g>
