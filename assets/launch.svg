<text class="in" style="animation-delay:0.2s" x="130" y="145" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">Engineered in the shadow, trained on human emotion.</text>
