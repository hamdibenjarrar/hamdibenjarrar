<text class="in" style="animation-delay:0.46s" x="84" y="326" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#c9a84c" fill-opacity="1" text-anchor="start" letter-spacing="0">the applause.</text>
<rect x="84" y="358" width="300" height="4" rx="2" fill="#fff" fill-opacity=".1"/><rect x="84" y="358" width="178" height="4" rx="2" fill="#c9a84c"/>
