<text class="in" style="animation-delay:0.3s" x="84" y="270" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">Build beautiful things</text>
