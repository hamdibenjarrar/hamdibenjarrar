<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" role="img" aria-label="Now building: MYNTHISM, Aura, Ghazala Cinematic Lab, npm Pulse, awesome-arabic-dev, DinarWise.">
<defs>
<clipPath id="frame"><rect width="1200" height="500" rx="28"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.o{animation:drift 16s ease-in-out infinite alternate}.o2{animation-duration:21s;animation-direction:alternate-reverse}.o3{animation-duration:26s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,36px)}}
.sheen{animation:sheen 7s cubic-bezier(.16,1,.3,1) infinite}
@keyframes sheen{0%,35%{transform:translateX(-40%) skewX(-18deg)}80%,100%{transform:translateX(140%) skewX(-18deg)}}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}

</style>
<g clip-path="url(#frame)">
<rect width="1200" height="500" fill="#07070a"/>
<g filter="url(#blur)" opacity=".62"><circle class="o o1" cx="120" cy="450" r="210" fill="#c9a84c"/><circle class="o o2" cx="1080" cy="50" r="210" fill="#c23a3a"/><circle class="o o3" cx="600" cy="200" r="210" fill="#8fb8ff"/></g>
<text x="48" y="62" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#c9a84c" fill-opacity="1" text-anchor="start" letter-spacing="3">NOW BUILDING</text><g class="in" style="animation-delay:0s"><rect x="36" y="88" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="37.5" y="89.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="60" y="134" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">MYNTHISM</text><text x="60" y="164" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">A creative AI studio: brand systems, sites</text><text x="60" y="185" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">and the agents that run behind them.</text><rect x="60" y="214" width="55.6" height="26" rx="13" fill="#c9a84c" fill-opacity=".14" stroke="#c9a84c" stroke-opacity=".55"/><text x="87.8" y="231.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#c9a84c">LIVE</text></g><g class="in" style="animation-delay:0.1s"><rect x="416" y="88" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="417.5" y="89.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="440" y="134" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">Aura</text><text x="440" y="164" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">An Arabic first assistant that answers from an</text><text x="440" y="185" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">organisation’s own documents and cites them.</text><rect x="440" y="214" width="107.4" height="26" rx="13" fill="#8fb8ff" fill-opacity=".14" stroke="#8fb8ff" stroke-opacity=".55"/><text x="493.7" y="231.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#8fb8ff">IN PROGRESS</text></g><g class="in" style="animation-delay:0.2s"><rect x="796" y="88" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="797.5" y="89.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="820" y="134" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">Ghazala Cinematic Lab</text><text x="820" y="164" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">Animated site in Arabic, English and French,</text><text x="820" y="185" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">and the magazine, for a film lab in Tripoli.</text><rect x="820" y="214" width="114.80000000000001" height="26" rx="13" fill="#c23a3a" fill-opacity=".14" stroke="#c23a3a" stroke-opacity=".55"/><text x="877.4" y="231.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#c23a3a">PREVIEW LIVE</text></g><g class="in" style="animation-delay:0.30000000000000004s"><rect x="36" y="284" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="37.5" y="285.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="60" y="330" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">npm Pulse</text><text x="60" y="360" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">A free, open API that gives any npm package</text><text x="60" y="381" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">a health score from 0 to 100.</text><rect x="60" y="410" width="55.6" height="26" rx="13" fill="#c9a84c" fill-opacity=".14" stroke="#c9a84c" stroke-opacity=".55"/><text x="87.8" y="427.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#c9a84c">LIVE</text></g><g class="in" style="animation-delay:0.4s"><rect x="416" y="284" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="417.5" y="285.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="440" y="330" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">awesome-arabic-dev</text><text x="440" y="360" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">A curated list of resources for</text><text x="440" y="381" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">Arabic speaking developers.</text><rect x="440" y="410" width="107.4" height="26" rx="13" fill="#8fb8ff" fill-opacity=".14" stroke="#8fb8ff" stroke-opacity=".55"/><text x="493.7" y="427.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#8fb8ff">OPEN SOURCE</text></g><g class="in" style="animation-delay:0.5s"><rect x="796" y="284" width="368" height="180" rx="20" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="797.5" y="285.5" width="365" height="90" rx="19" fill="url(#hl)"/><text x="820" y="330" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="0">DinarWise</text><text x="820" y="360" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">A personal finance tracker built with</text><text x="820" y="381" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="start" letter-spacing="0">Next.js and MongoDB.</text><rect x="820" y="410" width="85.2" height="26" rx="13" fill="#a8a39a" fill-opacity=".14" stroke="#a8a39a" stroke-opacity=".55"/><text x="862.6" y="427.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#a8a39a">COMPLETE</text></g>
<rect class="sheen" x="0" y="0" width="360" height="500" fill="url(#sheen)"/>
</g>
<rect x=".6" y=".6" width="1198.8" height="498.8" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
</svg>
