<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" role="img" aria-label="Hamdi Ben Jarrar. Designer, full stack and AI developer, creative director. Founder of MYNTHISM. Tunis and Tripoli.">
<defs>
<clipPath id="frame"><rect width="1200" height="444" rx="28"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.o{animation:drift 16s ease-in-out infinite alternate}.o2{animation-duration:21s;animation-direction:alternate-reverse}.o3{animation-duration:26s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,36px)}}
.sheen{animation:sheen 7s cubic-bezier(.16,1,.3,1) infinite}
@keyframes sheen{0%,35%{transform:translateX(-40%) skewX(-18deg)}80%,100%{transform:translateX(140%) skewX(-18deg)}}
.in{animation:in .9s cubic-bezier(.16,1,.3,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.rot{opacity:0;animation:rot 12s linear infinite}@keyframes rot{0%,3%{opacity:0;transform:translateY(8px)}7%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
.ring{transform-origin:1010px 222px;animation:spin 28s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.core{transform-origin:1010px 222px;animation:breath 5s ease-in-out infinite}@keyframes breath{50%{transform:scale(1.06)}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="444" fill="#07070a"/>
<g filter="url(#blur)" opacity=".62"><circle class="o o1" cx="168.00000000000003" cy="88.80000000000001" r="186.48" fill="#c23a3a"/><circle class="o o2" cx="1032" cy="133.2" r="186.48" fill="#8fb8ff"/><circle class="o o3" cx="660" cy="444" r="186.48" fill="#c9a84c"/></g>
<rect x="36" y="36" width="1128" height="372" rx="26" fill="#fff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.2"/><rect x="37.5" y="37.5" width="1125" height="90" rx="25" fill="url(#hl)"/>
<text class="in" style="animation-delay:0s" x="76" y="92" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#c9a84c" fill-opacity="1" text-anchor="start" letter-spacing="3">◈  MYNTHISM</text>
<text class="in" style="animation-delay:0.1s" x="840" y="92" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" font-weight="400" fill="#a8a39a" fill-opacity="1" text-anchor="end" letter-spacing="3">TUNIS  ·  TRIPOLI</text>
<text class="in" style="animation-delay:0.15s" x="74" y="190" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="78" font-weight="700" fill="#f5f0e8" fill-opacity="1" text-anchor="start" letter-spacing="-1.5">Hamdi Ben Jarrar</text>
<text class="in" style="animation-delay:.3s" x="76" y="240" font-family="'Geeza Pro','Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif" font-size="30" fill="#f5f0e8" fill-opacity=".85" direction="rtl" text-anchor="end" unicode-bidi="plaintext">حمدي بن جرار</text>
<text class="in" style="animation-delay:0.45s" x="76" y="292" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#f5f0e8" fill-opacity="0.92" text-anchor="start" letter-spacing="0">Designer  ·  Full stack and AI developer  ·  Creative director</text>
<rect class="in" style="animation-delay:.55s" x="76" y="314" width="56" height="2" fill="#c9a84c"/>
<text class="rot" style="animation-delay:0s" x="76" y="354" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#a8a39a">Founder of MYNTHISM, a creative AI studio.</text><text class="rot" style="animation-delay:4s" x="76" y="354" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#a8a39a">I design the brand, build the site, and wire the agents behind it.</text><text class="rot" style="animation-delay:8s" x="76" y="354" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#a8a39a">Self taught. Arabic, French, English, and some German.</text>
<g class="in" style="animation-delay:.6s">
<circle cx="1010" cy="222" r="128" fill="#fff" fill-opacity=".05" stroke="url(#edge)" stroke-width="1.2"/>
<g class="ring"><circle cx="1114.0" cy="222.0" r="5" fill="#c9a84c"/><circle cx="1083.5" cy="295.5" r="3" fill="#f5f0e8"/><circle cx="1010.0" cy="326.0" r="5" fill="#c9a84c"/><circle cx="936.5" cy="295.5" r="3" fill="#f5f0e8"/><circle cx="906.0" cy="222.0" r="5" fill="#c9a84c"/><circle cx="936.5" cy="148.5" r="3" fill="#f5f0e8"/><circle cx="1010.0" cy="118.0" r="5" fill="#c9a84c"/><circle cx="1083.5" cy="148.5" r="3" fill="#f5f0e8"/></g>
<g class="core"><circle cx="1010" cy="222" r="62" fill="#fff" fill-opacity=".08" stroke="url(#edge)"/><text x="1010" y="246" text-anchor="middle" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" fill="#c9a84c">◈</text></g>
</g>
<rect class="sheen" x="0" y="0" width="360" height="444" fill="url(#sheen)"/>
</g>
<rect x=".6" y=".6" width="1198.8" height="442.8" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
</svg>
